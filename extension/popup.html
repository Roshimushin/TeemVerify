<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TeemVerify</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    main { width: 380px; padding: 16px; }
    #list { margin: 12px 0 0; padding: 0; list-style: none; max-height: 380px; overflow-y: auto; }
    #list li { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.4; }
    .sentence { margin-bottom: 4px; }
    .item { display: flex; gap: 6px; align-items: baseline; margin-top: 2px; }
    .badge {
      flex: none;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .reason { color: var(--muted); }
    .small { padding: 3px 8px; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>TeemVerify</h1>
    <p id="status" class="muted" role="status">Checking connection…</p>
    <div class="row" style="margin-top: 0">
      <button id="lookup" disabled>Check this page</button>
      <button id="checkAll" class="secondary" hidden></button>
    </div>
    <p id="result" class="muted" role="status" hidden></p>
    <ul id="list" hidden></ul>
    <div class="row"><a href="options.html" target="_blank">Settings</a></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
